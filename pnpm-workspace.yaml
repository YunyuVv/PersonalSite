packages:
  - "."

# pnpm 11 用 allowBuilds 控制依赖构建脚本审批（替代旧版 onlyBuiltDependencies / ignoredBuiltDependencies）
# true = 允许该依赖执行 install/build 脚本；false = 忽略（不执行）
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  unrs-resolver: false

# 依赖覆盖（pnpm v10+ workspace 项目必须放在此处）
overrides:
  balanced-match: 4.0.4
